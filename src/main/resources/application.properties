spring.application.name=abi-diff
server.port=5347
# SQLite database locations (overridable for tests).
abidiff.snapshot-db=./data/abi-snapshot.db
abidiff.decision-db=./data/abi-decision.db
# Idempotent fixture seeding on startup (release-version scoped, safe to re-run).
abidiff.seed-fixtures=true
spring.jackson.default-property-inclusion=non_null
